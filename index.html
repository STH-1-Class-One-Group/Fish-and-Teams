<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish and Teams</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"
      integrity="sha384-lLe9t9o9V9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9zV9z"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/mini-game.css" />
    <link rel="stylesheet" href="css/utillity.css" />
  </head>
  <body class="ocean">
    <header>
      <h1 class="logo">
        <a href="index.html"><img src="/img/Signature.svg" alt="로고" /></a>
      </h1>
      <div class="header-btn-area">
        <div class="relative width100px height40px">
          <button
            id="theme-display-btn"
            class="relative width100px height40px z-index-0 border-radius-10 text-bold transition-all-0-3"
          >
            오션모드
          </button>

          <select
            id="theme-select"
            name="theme-select"
            class="z-index-5 absolute left0 top0 width100px height40px opacity-0 cursor-pointer"
          >
            <option value="dark" class="text-bold">다크모드</option>
            <option value="light" class="text-bold">라이트 모드</option>
            <option value="ocean" class="text-bold" selected>오션모드</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <div class="add-banner-left"></div>
      <div class="container">
        <section class="members">
          <h2>멤버 목록</h2>
          <div
            class="manage-buttons"
            style="
              margin-bottom: 20px;
              display: flex;
              gap: 10px;
              justify-content: flex-end;
            "
          >
            <button
              onclick="addMember()"
              class="header-btn"
              style="background: #4a90e2; color: white"
            >
              추가
            </button>
            <button
              onclick="modifyMember()"
              class="header-btn"
              style="background: #50c878; color: white"
            >
              수정
            </button>
            <button
              onclick="delMember()"
              class="header-btn"
              style="background: #ff6b6b; color: white"
            >
              삭제
            </button>
          </div>
          <div class="table">
            <ul class="table-row table-header">
              <li class="table-cells tc-checkbox center">
                <input type="checkbox" onclick="sumCheckbox(this)" />
              </li>
              <li class="table-cells tc-number">No</li>
              <li class="table-cells tc-etc">이름</li>
              <li class="table-cells tc-etc">나이</li>
              <li class="table-cells tc-etc">성별</li>
              <li class="table-cells tc-etc">능력치</li>
            </ul>
            <ul class="table-data scrollbar"></ul>
          </div>
        </section>

        <section>
          <h2>팀 배정</h2>
          <div class="flex flex-gap-20 align-center">
            <div class="flex align-center">
              <p class="text-bold">팀 수</p>
              <input
                class="margin-left-10 dark-text"
                type="number"
                id="input-team-count"
                value="2"
                min="2"
              /><span class="margin-left-5">명</span>
            </div>
            <div class="flex align-center flex-gap-10">
              <p class="text-bold">밸런스</p>
              <ul class="flex flex-gap-10">
                <li class="flex flex-gap-5 align-center">
                  <input type="checkbox" id="chk-age" />
                  <p>나이</p>
                </li>
                <li class="flex flex-gap-5 align-center">
                  <input type="checkbox" id="chk-gender" checked />
                  <p>성별</p>
                </li>
                <li class="flex flex-gap-5 align-center">
                  <input type="checkbox" id="chk-ability" checked />
                  <p>능력치</p>
                </li>
              </ul>
            </div>
          </div>
          <div style="margin-top: 20px; display: flex; gap: 10px">
            <button
              id="btn-assign-teams"
              class="header-btn"
              style="background: #007bff; color: white"
            >
              ⚖️ 조건부 배정
            </button>
            <button
              id="btn-random-teams"
              class="header-btn"
              style="background: #28a745; color: white"
            >
              🎲 랜덤 배정
            </button>
          </div>
        </section>
      </div>
      <div class="add-banner-right"></div>
    </main>

    <div id="minigame-overlay">
      <button id="skip-btn" onclick="skipGame()">SKIP ≫</button>
      <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="game-screens-wrapper"></div>
      </div>
      <div id="game-result-overlay">
        <h3
          style="
            font-size: 24px;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
          "
          class="dark-text"
        >
          🎣 배정 완료!
        </h3>
        <p
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
          "
          class="dark-text"
        >
          모든 팀원을 낚아올렸습니다.
        </p>
        <button
          onclick="closeGameAndShowResult()"
          style="
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
          "
          class="dark-text"
        >
          결과 확인하기
        </button>
      </div>
    </div>

    <div id="final-result-modal">
      <div class="modal-content">
        <button class="close-modal-btn dark-text" onclick="closeResultModal()">
          ✕
        </button>
        <h2
          style="
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
          "
          class="dark-text"
        >
          🎉 팀 배정 결과
        </h2>
        <div
          id="team-result-content"
          style="
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
          "
        ></div>
      </div>
    </div>

    <footer></footer>

    <script type="module" src="src/view/crud.js"></script>
  </body>
</html>
