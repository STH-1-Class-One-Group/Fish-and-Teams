<!--
  [파일 역할]
  - Fish and Teams의 전체 화면 구조(레이아웃)와 주요 진입점을 정의하는 메인 HTML 파일.

  [왜 필요한가]
  - 사용자에게 멤버 관리, 팀 배정, 낚시 미니게임, 최종 결과 모달을 한 페이지에서 제공하기 위해 필요.
  - JS 모듈들이 동작할 기준 DOM(id/class)을 제공하므로, 화면과 로직을 연결하는 핵심 앵커 파일이다.

  [핵심 기능]
  - 헤더: 테마 선택 UI(theme-select, theme-display-btn)
  - 본문: 멤버 CRUD 테이블 + 팀 배정 옵션/버튼
  - 오버레이: 미니게임 화면(minigame-overlay), 결과 오버레이(game-result-overlay)
  - 모달: 최종 팀 결과(final-result-modal)
  - 진입 스크립트: src/view/crud.js (앱 초기화 및 이벤트 연결)
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish and Teams</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-588393FG");
    </script>
    <!-- End Google Tag Manager -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/mini-game.css" />
    <link rel="stylesheet" href="css/utillity.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="ocean">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-588393FG"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header>
      <h1 class="logo">
        <a href="index.html"><img src="/img/Signature.svg" alt="로고" /></a>
      </h1>
      <div class="header-btn-area">
        <div class="relative width100px height40px">
          <button
            id="theme-display-btn"
            class="relative width100px height40px z-index-0 border-radius-10 text-bold transition-all-0-3"
          >
            오션모드
          </button>

          <select
            id="theme-select"
            name="theme-select"
            class="z-index-5 absolute left0 top0 width100px height40px opacity-0 cursor-pointer"
            aria-label="모드 선택"
          >
            <option value="dark" class="text-bold">다크모드</option>
            <option value="light" class="text-bold">라이트 모드</option>
            <option value="ocean" class="text-bold" selected>오션모드</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <div class="add-banner-left"></div>
      <div class="container">
        <section class="members">
          <h2>멤버 목록</h2>
          <div
            class="manage-buttons"
            style="
              margin-bottom: 20px;
              display: flex;
              gap: 10px;
              justify-content: flex-end;
            "
          >
            <button
              onclick="addMember()"
              class="header-btn"
              style="background: #4a90e2; color: white"
            >
              추가
            </button>
            <button
              onclick="modifyMember()"
              class="header-btn"
              style="background: #50c878; color: white"
            >
              수정
            </button>
            <button
              onclick="delMember()"
              class="header-btn"
              style="background: #ff6b6b; color: white"
            >
              삭제
            </button>
          </div>
          <div class="table">
            <ul class="table-row table-header">
              <li class="table-cells tc-checkbox center">
                <input
                  type="checkbox"
                  aria-label="전체 선택"
                  onclick="sumCheckbox(this)"
                />
              </li>
              <li class="table-cells tc-number">No</li>
              <li class="table-cells tc-etc">이름</li>
              <li class="table-cells tc-etc">나이</li>
              <li class="table-cells tc-etc">성별</li>
              <li class="table-cells tc-etc">능력치</li>
            </ul>
            <ul class="table-data scrollbar"></ul>
          </div>
        </section>

        <section>
          <h2>팀 배정</h2>
          <div class="flex flex-gap-20 align-center">
            <div class="flex align-center">
              <p class="text-bold">팀 수</p>
              <input
                aria-label="팀 수"
                class="margin-left-10 dark-text"
                type="number"
                id="input-team-count"
                value="2"
                min="2"
              /><span class="margin-left-5">명</span>
            </div>
            <div class="flex align-center flex-gap-10">
              <p class="text-bold">밸런스</p>
              <ul class="flex flex-gap-10">
                <li class="flex flex-gap-5 align-center">
                  <input aria-label="나이 밸런스" type="checkbox" id="chk-age" />
                  <p>나이</p>
                </li>
                <li class="flex flex-gap-5 align-center">
                  <input aria-label="성별 밸런스" type="checkbox" id="chk-gender" checked />
                  <p>성별</p>
                </li>
                <li class="flex flex-gap-5 align-center">
                  <input aria-label="능력치 밸런스" type="checkbox" id="chk-ability" checked />
                  <p>능력치</p>
                </li>
              </ul>
            </div>
          </div>
          <div style="margin-top: 20px; display: flex; gap: 10px">
            <button
              id="btn-assign-teams"
              class="header-btn"
              style="background: #007bff; color: white"
            >
              ⚖️ 조건부 배정
            </button>
            <button
              id="btn-random-teams"
              class="header-btn"
              style="background: #28a745; color: white"
            >
              🎲 랜덤 배정
            </button>
          </div>
        </section>
      </div>
      <div class="add-banner-right"></div>
    </main>

    <div id="minigame-overlay">
      <button id="skip-btn" onclick="skipGame()">SKIP ≫</button>
      <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="game-screens-wrapper"></div>
      </div>
      <div id="game-result-overlay">
        <h3
          style="
            font-size: 24px;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
          "
          class="dark-text"
        >
          🎣 배정 완료!
        </h3>
        <p
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
          "
          class="dark-text"
        >
          모든 팀원을 낚아올렸습니다.
        </p>
        <button
          onclick="closeGameAndShowResult()"
          style="
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
          "
          class="dark-text"
        >
          결과 확인하기
        </button>
      </div>
    </div>

    <div id="final-result-modal">
      <div class="modal-content">
        <button class="close-modal-btn dark-text" onclick="closeResultModal()">
          ✕
        </button>
        <h2
          style="
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
          "
          class="dark-text"
        >
          🎉 팀 배정 결과
        </h2>
        <div
          id="team-result-content"
          style="
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
          "
        ></div>
      </div>
    </div>

    <footer></footer>

    <script type="module" src="/assest/view/crud.js"></script>
  </body>
</html>
